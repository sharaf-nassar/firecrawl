[package]
name = "firecrawl-browser-execution-adapter"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "=1.0.102"
futures-util = { version = "=0.3.31", default-features = false, features = ["sink"] }
nix = { version = "=0.31.3", features = ["fs", "process", "signal", "socket", "uio"] }
reqwest = { version = "=0.13.2", default-features = false, features = ["json", "rustls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tokio = { version = "=1.49.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["connect", "handshake"] }
uuid = { version = "=1.20.0", features = ["serde", "v4"] }
zeroize = "=1.8.2"
