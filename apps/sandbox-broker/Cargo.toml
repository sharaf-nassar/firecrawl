[package]
name = "firecrawl-sandbox-broker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "=1.0.102"
nix = { version = "=0.31.3", features = ["dir", "fs", "poll", "process", "signal", "socket", "uio", "user"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
uuid = { version = "=1.20.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "=3.25.0"

[lib]
name = "firecrawl_sandbox_broker"
path = "src/lib.rs"

[[bin]]
name = "firecrawl-sandbox-broker"
path = "src/main.rs"

[[bin]]
name = "acceptance-restart-broker"
path = "src/bin/acceptance_restart_broker.rs"
