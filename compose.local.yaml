x-local-api-image: &local-api-image
  build: apps/api
  image: firecrawl-local-api:local

services:
  api:
    <<: *local-api-image
    ports: !override
      - "127.0.0.1:${PORT:-3002}:${INTERNAL_PORT:-3002}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || '3002') + '/', { signal: AbortSignal.timeout(4000) }).then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      playwright-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nuq-postgres:
        condition: service_healthy
      app-db-migrate:
        condition: service_completed_successfully
    environment:
      USE_DB_AUTHENTICATION: "false"
      LOCAL_PERSISTENCE_ENABLED: ${LOCAL_PERSISTENCE_ENABLED}
      APPLICATION_DATABASE_URL: "postgresql://${APP_POSTGRES_USER}:${APP_POSTGRES_PASSWORD}@app-postgres:5432/${APP_POSTGRES_DB}"
      LOCAL_OWNER_ID: ${LOCAL_OWNER_ID}
      LOCAL_RECORD_RETENTION_DAYS: ${LOCAL_RECORD_RETENTION_DAYS}
      LOCAL_ARTIFACT_RETENTION_DAYS: ${LOCAL_ARTIFACT_RETENTION_DAYS}

  app-postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_USER: ${APP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD}
      POSTGRES_DB: ${APP_POSTGRES_DB}
    networks:
      - backend
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app-db-migrate:
    <<: *local-api-image
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    environment:
      ENV: local
      USE_DB_AUTHENTICATION: "false"
      LOCAL_PERSISTENCE_ENABLED: ${LOCAL_PERSISTENCE_ENABLED}
      APPLICATION_DATABASE_URL: "postgresql://${APP_POSTGRES_USER}:${APP_POSTGRES_PASSWORD}@app-postgres:5432/${APP_POSTGRES_DB}"
      LOCAL_OWNER_ID: ${LOCAL_OWNER_ID}
      LOCAL_RECORD_RETENTION_DAYS: ${LOCAL_RECORD_RETENTION_DAYS}
      LOCAL_ARTIFACT_RETENTION_DAYS: ${LOCAL_ARTIFACT_RETENTION_DAYS}
    command: node dist/src/db/migrate.js
    restart: "no"
    depends_on:
      app-postgres:
        condition: service_healthy

  playwright-service:
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    command: redis-server --bind 0.0.0.0 --appendonly yes
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    restart: unless-stopped
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  nuq-postgres:
    restart: unless-stopped
    volumes:
      - nuq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  foundationdb:
    profiles: ["foundationdb"]

  foundationdb-init:
    profiles: ["foundationdb"]

volumes:
  redis-data:
  rabbitmq-data:
  nuq-postgres-data:
  app-postgres-data:
