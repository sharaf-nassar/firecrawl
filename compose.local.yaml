x-local-api-image: &local-api-image
  build: apps/api
  image: firecrawl-local-api:local

services:
  api:
    <<: *local-api-image
    entrypoint:
      - /bin/sh
      - -ec
      - 'chmod 0700 /var/lib/firecrawl-browser && exec "$$@"'
      - --
    ports: !override
      - "127.0.0.1:${PORT:-3002}:${INTERNAL_PORT:-3002}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || '3002') + '/', { signal: AbortSignal.timeout(4000) }).then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      playwright-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nuq-postgres:
        condition: service_healthy
      app-db-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      USE_DB_AUTHENTICATION: "false"
      LOCAL_PERSISTENCE_ENABLED: ${LOCAL_PERSISTENCE_ENABLED}
      LOCAL_BROWSER_SERVICE_ENABLED: "false"
      LOCAL_BROWSER_STATE_ROOT: ${LOCAL_BROWSER_STATE_ROOT:-/var/lib/firecrawl-browser}
      APPLICATION_DATABASE_URL: "postgresql://${APP_POSTGRES_USER}:${APP_POSTGRES_PASSWORD}@app-postgres:5432/${APP_POSTGRES_DB}"
      LOCAL_OWNER_ID: ${LOCAL_OWNER_ID}
      LOCAL_RECORD_RETENTION_DAYS: ${LOCAL_RECORD_RETENTION_DAYS}
      LOCAL_ARTIFACT_RETENTION_DAYS: ${LOCAL_ARTIFACT_RETENTION_DAYS}
      ARTIFACT_STORE_PROVIDER: ${ARTIFACT_STORE_PROVIDER}
      ARTIFACT_MINIO_ENDPOINT: ${ARTIFACT_MINIO_ENDPOINT}
      ARTIFACT_MINIO_ACCESS_KEY: ${ARTIFACT_MINIO_ACCESS_KEY}
      ARTIFACT_MINIO_SECRET_KEY: ${ARTIFACT_MINIO_SECRET_KEY}
      ARTIFACT_MINIO_BUCKET: ${ARTIFACT_MINIO_BUCKET}
      ARTIFACT_MINIO_REGION: ${ARTIFACT_MINIO_REGION}
    volumes:
      - browser-state:/var/lib/firecrawl-browser

  app-postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_USER: ${APP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD}
      POSTGRES_DB: ${APP_POSTGRES_DB}
    networks:
      - backend
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app-db-migrate:
    <<: *local-api-image
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    environment:
      ENV: local
      USE_DB_AUTHENTICATION: "false"
      LOCAL_PERSISTENCE_ENABLED: ${LOCAL_PERSISTENCE_ENABLED}
      APPLICATION_DATABASE_URL: "postgresql://${APP_POSTGRES_USER}:${APP_POSTGRES_PASSWORD}@app-postgres:5432/${APP_POSTGRES_DB}"
      LOCAL_OWNER_ID: ${LOCAL_OWNER_ID}
      LOCAL_RECORD_RETENTION_DAYS: ${LOCAL_RECORD_RETENTION_DAYS}
      LOCAL_ARTIFACT_RETENTION_DAYS: ${LOCAL_ARTIFACT_RETENTION_DAYS}
    command: node dist/src/db/migrate.js
    restart: "no"
    depends_on:
      app-postgres:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - backend
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null
        mc mb --ignore-existing local/$${ARTIFACT_MINIO_BUCKET} >/dev/null
        mc admin policy create local firecrawl-artifacts /policy/minio-artifact-policy.json >/dev/null
        mc admin user add local "$${ARTIFACT_MINIO_ACCESS_KEY}" "$${ARTIFACT_MINIO_SECRET_KEY}" >/dev/null
        mc admin policy attach local firecrawl-artifacts --user "$${ARTIFACT_MINIO_ACCESS_KEY}" >/dev/null
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      ARTIFACT_MINIO_ACCESS_KEY: ${ARTIFACT_MINIO_ACCESS_KEY}
      ARTIFACT_MINIO_SECRET_KEY: ${ARTIFACT_MINIO_SECRET_KEY}
      ARTIFACT_MINIO_BUCKET: ${ARTIFACT_MINIO_BUCKET}
    networks:
      - backend
    volumes:
      - ./apps/api/config/minio-artifact-policy.json:/policy/minio-artifact-policy.json:ro
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy

  playwright-service:
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    command: redis-server --bind 0.0.0.0 --appendonly yes
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    restart: unless-stopped
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  nuq-postgres:
    restart: unless-stopped
    volumes:
      - nuq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  foundationdb:
    profiles: ["foundationdb"]

  foundationdb-init:
    profiles: ["foundationdb"]

volumes:
  redis-data:
  rabbitmq-data:
  nuq-postgres-data:
  app-postgres-data:
  minio-data:
  browser-state:
