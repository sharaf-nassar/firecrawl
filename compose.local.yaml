x-local-api-image: &local-api-image
  build: apps/api
  image: firecrawl-local-api:local

services:
  api:
    <<: *local-api-image
    ports: !override
      - "127.0.0.1:${PORT:-3002}:${INTERNAL_PORT:-3002}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.PORT || '3002') + '/', { signal: AbortSignal.timeout(4000) }).then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      app-postgres:
        condition: service_healthy
      browser-interaction-worker:
        condition: service_healthy
      browser-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      playwright-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nuq-postgres:
        condition: service_healthy
    environment:
      USE_DB_AUTHENTICATION: "false"
      LOCAL_PERSISTENCE_ENABLED: ${LOCAL_PERSISTENCE_ENABLED}
      LOCAL_SEARCH_WEB_ONLY: "true"
      SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT:-http://searxng:8080}
      SEARXNG_ENGINES: ${SEARXNG_ENGINES:-}
      SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES:-}
      SEARCH_PROVIDER_TIMEOUT_MS: "10000"
      SEARCH_PROVIDER_MAX_RESULTS: "100"
      SEARCH_PROVIDER_MAX_CONCURRENCY: "4"
      LOCAL_BROWSER_SERVICE_ENABLED: "true"
      LOCAL_BROWSER_STATE_ROOT: ${LOCAL_BROWSER_STATE_ROOT:-/var/lib/firecrawl-browser-volume/state}
      BROWSER_SERVICE_URL: http://browser-service:3010
      BROWSER_SERVICE_API_KEY: ${BROWSER_SERVICE_API_KEY}
      BROWSER_INTERACTION_WORKER_SOCKET_PATH: /run/firecrawl-interaction/worker.sock
      BROWSER_INTERACTION_WORKER_TOKEN: ${BROWSER_INTERACTION_WORKER_TOKEN:?set BROWSER_INTERACTION_WORKER_TOKEN in .env}
      BROWSER_REPLAY_INGEST_URL: http://127.0.0.1:${INTERNAL_PORT:-3002}
      BROWSER_REPLAY_INGEST_API_KEY: ${BROWSER_REPLAY_INGEST_API_KEY}
      BROWSER_SERVICE_REQUEST_TIMEOUT_MS: ${BROWSER_SERVICE_REQUEST_TIMEOUT_MS:-60000}
      BROWSER_RECONCILIATION_TIMEOUT_MS: ${BROWSER_RECONCILIATION_TIMEOUT_MS:-60000}
      BROWSER_RECONCILIATION_MAX_ATTEMPTS: ${BROWSER_RECONCILIATION_MAX_ATTEMPTS:-4}
      BROWSER_RECONCILIATION_INITIAL_BACKOFF_MS: ${BROWSER_RECONCILIATION_INITIAL_BACKOFF_MS:-250}
      BROWSER_RECONCILIATION_MAX_BACKOFF_MS: ${BROWSER_RECONCILIATION_MAX_BACKOFF_MS:-2000}
      BROWSER_RECONCILIATION_STARTUP_BUDGET_MS: ${BROWSER_RECONCILIATION_STARTUP_BUDGET_MS:-60000}
      BROWSER_RECONCILIATION_MONITOR_INTERVAL_MS: ${BROWSER_RECONCILIATION_MONITOR_INTERVAL_MS:-5000}
      BROWSER_RECONCILIATION_RETRY_COOLDOWN_MS: ${BROWSER_RECONCILIATION_RETRY_COOLDOWN_MS:-30000}
      BROWSER_PUBLIC_API_ORIGIN: ${BROWSER_PUBLIC_API_ORIGIN:-http://127.0.0.1:3002}
      APPLICATION_DATABASE_URL: "postgresql://${APP_POSTGRES_USER}:${APP_POSTGRES_PASSWORD}@app-postgres:5432/${APP_POSTGRES_DB}"
      LOCAL_OWNER_ID: ${LOCAL_OWNER_ID}
      LOCAL_RECORD_RETENTION_DAYS: ${LOCAL_RECORD_RETENTION_DAYS}
      LOCAL_ARTIFACT_RETENTION_DAYS: ${LOCAL_ARTIFACT_RETENTION_DAYS}
      ARTIFACT_STORE_PROVIDER: ${ARTIFACT_STORE_PROVIDER}
      ARTIFACT_MINIO_ENDPOINT: ${ARTIFACT_MINIO_ENDPOINT}
      ARTIFACT_MINIO_ACCESS_KEY: ${ARTIFACT_MINIO_ACCESS_KEY}
      ARTIFACT_MINIO_SECRET_KEY: ${ARTIFACT_MINIO_SECRET_KEY}
      ARTIFACT_MINIO_BUCKET: ${ARTIFACT_MINIO_BUCKET}
      ARTIFACT_MINIO_REGION: ${ARTIFACT_MINIO_REGION}
    networks:
      - backend
    group_add:
      - "1000"
    volumes:
      - type: volume
        source: browser-interaction-socket
        target: /run/firecrawl-interaction
        read_only: true

  browser-interaction-worker:
    build:
      context: apps/browser-interaction-worker
      dockerfile: Dockerfile
      target: worker
    image: firecrawl-local-browser-interaction-worker:local
    user: "1000:1000"
    read_only: true
    init: true
    environment:
      BROWSER_INTERACTION_WORKER_SOCKET_PATH: /run/firecrawl-interaction/worker.sock
      BROWSER_INTERACTION_WORKER_TOKEN: ${BROWSER_INTERACTION_WORKER_TOKEN:?set BROWSER_INTERACTION_WORKER_TOKEN in .env}
      CODEX_BIN: /opt/codex/bin/codex.js
      CODEX_HOME: /tmp/codex-home
      CODEX_AUTH_SEED_FILE: /run/secrets/codex-auth.json
      CODEX_AUTH_STATE_DIR: /var/lib/firecrawl-codex-auth-state
      CODEX_CA_CERTIFICATE: /run/certs/host-ca-certificates.crt
      SSL_CERT_FILE: /run/certs/host-ca-certificates.crt
      NODE_EXTRA_CA_CERTS: /run/certs/host-ca-certificates.crt
      MODEL_EGRESS_PROXY_SOCKET_PATH: /run/firecrawl-model-egress/proxy.sock
      HTTP_PROXY: http://127.0.0.1:3128
      HTTPS_PROXY: http://127.0.0.1:3128
      NO_PROXY: ""
      http_proxy: http://127.0.0.1:3128
      https_proxy: http://127.0.0.1:3128
      no_proxy: ""
    network_mode: none
    volumes:
      - type: bind
        source: ${LOCAL_CODEX_PACKAGE_DIR:?scripts/local-firecrawl must resolve LOCAL_CODEX_PACKAGE_DIR}
        target: /opt/codex
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LOCAL_CODEX_AUTH_FILE:?scripts/local-firecrawl must resolve LOCAL_CODEX_AUTH_FILE}
        target: /run/secrets/codex-auth.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LOCAL_CODEX_CA_BUNDLE_FILE:?scripts/local-firecrawl must resolve LOCAL_CODEX_CA_BUNDLE_FILE}
        target: /run/certs/host-ca-certificates.crt
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: codex-auth-state
        target: /var/lib/firecrawl-codex-auth-state
      - type: volume
        source: browser-interaction-socket
        target: /run/firecrawl-interaction
      - type: volume
        source: browser-interaction-egress-socket
        target: /run/firecrawl-model-egress
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1G
    memswap_limit: 1G
    pids_limit: 512
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=256m,mode=1777
      - /tmp/codex-home:noexec,nosuid,nodev,size=64m,mode=0700,uid=1000,gid=1000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const http=require('node:http');const r=http.request({socketPath:'/run/firecrawl-interaction/worker.sock',path:'/health/ready',signal:AbortSignal.timeout(4000)},s=>{s.resume();s.on('end',()=>process.exit(s.statusCode===200?0:1))});r.on('error',()=>process.exit(1));r.end()"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      browser-interaction-egress-proxy:
        condition: service_healthy

  browser-interaction-egress-proxy:
    build:
      context: apps/browser-interaction-worker
      dockerfile: Dockerfile
      target: model-egress-proxy
    image: firecrawl-local-browser-interaction-egress-proxy:local
    user: "1000:1000"
    read_only: true
    init: true
    environment:
      MODEL_EGRESS_PROXY_SOCKET_PATH: /run/firecrawl-model-egress/proxy.sock
    networks:
      - model-uplink
    volumes:
      - type: volume
        source: browser-interaction-egress-socket
        target: /run/firecrawl-model-egress
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 64M
    memswap_limit: 64M
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=16m,mode=1777
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('node:net');const s=net.createConnection({path:'/run/firecrawl-model-egress/proxy.sock'});s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),4000).unref()"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  browser-state-init:
    build:
      context: .
      dockerfile: apps/browser-service/Dockerfile
      target: browser-volume-init
    image: firecrawl-local-browser-volume-init:local
    user: "0:0"
    networks:
      - backend
    volumes:
      - browser-state:/var/lib/firecrawl-browser-volume
    restart: "no"

  browser-service:
    build:
      context: .
      dockerfile: apps/browser-service/Dockerfile
      target: browser-service-runtime
    image: ${FIRECRAWL_BROWSER_SERVICE_IMAGE:-firecrawl-local-browser-service:local}
    user: "1000:1000"
    read_only: true
    environment:
      PORT: "3010"
      LOCAL_BROWSER_SERVICE_ENABLED: "true"
      LOCAL_BROWSER_STATE_ROOT: /var/lib/firecrawl-browser-volume/state
      BROWSER_SERVICE_API_KEY: ${BROWSER_SERVICE_API_KEY}
      MAX_BROWSER_SESSIONS: ${MAX_BROWSER_SESSIONS:-4}
    networks:
      - backend
    volumes:
      - browser-state:/var/lib/firecrawl-browser-volume
    restart: unless-stopped
    depends_on:
      browser-state-init:
        condition: service_completed_successfully
    cpus: 2.0
    mem_limit: 4G
    memswap_limit: 4G
    tmpfs:
      - /tmp:noexec,nosuid,size=1g
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const h={authorization:'Bearer '+process.env.BROWSER_SERVICE_API_KEY,'x-firecrawl-correlation-id':'compose-health','x-firecrawl-deadline':new Date(Date.now()+10000).toISOString()};fetch('http://127.0.0.1:3010/health/live',{headers:h,signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app-postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_USER: ${APP_POSTGRES_USER}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD}
      POSTGRES_DB: ${APP_POSTGRES_DB}
    networks:
      - backend
    volumes:
      - app-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app-db-migrate:
    <<: *local-api-image
    profiles: ["maintenance"]
    environment:
      ENV: local
      USE_DB_AUTHENTICATION: "false"
      LOCAL_PERSISTENCE_ENABLED: ${LOCAL_PERSISTENCE_ENABLED}
      APPLICATION_DATABASE_URL: "postgresql://${APP_POSTGRES_USER}:${APP_POSTGRES_PASSWORD}@app-postgres:5432/${APP_POSTGRES_DB}"
      LOCAL_OWNER_ID: ${LOCAL_OWNER_ID}
      LOCAL_RECORD_RETENTION_DAYS: ${LOCAL_RECORD_RETENTION_DAYS}
      LOCAL_ARTIFACT_RETENTION_DAYS: ${LOCAL_ARTIFACT_RETENTION_DAYS}
    command: node dist/src/db/migrate.js
    restart: "no"
    networks:
      - backend
    depends_on:
      app-postgres:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - backend
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null
        mc mb --ignore-existing local/$${ARTIFACT_MINIO_BUCKET} >/dev/null
        mc admin policy create local firecrawl-artifacts /policy/minio-artifact-policy.json >/dev/null
        mc admin user add local "$${ARTIFACT_MINIO_ACCESS_KEY}" "$${ARTIFACT_MINIO_SECRET_KEY}" >/dev/null
        mc admin policy attach local firecrawl-artifacts --user "$${ARTIFACT_MINIO_ACCESS_KEY}" >/dev/null
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      ARTIFACT_MINIO_ACCESS_KEY: ${ARTIFACT_MINIO_ACCESS_KEY}
      ARTIFACT_MINIO_SECRET_KEY: ${ARTIFACT_MINIO_SECRET_KEY}
      ARTIFACT_MINIO_BUCKET: ${ARTIFACT_MINIO_BUCKET}
    networks:
      - backend
    volumes:
      - ./apps/api/config/minio-artifact-policy.json:/policy/minio-artifact-policy.json:ro
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy

  searxng:
    image: ghcr.io/searxng/searxng:2026.7.31-6bfd82705@sha256:79c2be18a18367484474bae9b18a8cd9085114ab3dcd49cac091cad8c548a0a9
    user: "977:977"
    read_only: true
    init: true
    entrypoint:
      - /usr/local/searxng/.venv/bin/python
      - /opt/firecrawl/searxng-entrypoint.py
    environment:
      FORCE_OWNERSHIP: "false"
      SEARXNG_BRAVE_API_KEY_B64: ${SEARXNG_BRAVE_API_KEY_B64:-}
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    networks:
      - backend
    volumes:
      - type: bind
        source: ./config/searxng/settings.yml
        target: /etc/searxng/settings.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./config/searxng/entrypoint.py
        target: /opt/firecrawl/searxng-entrypoint.py
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 512M
    memswap_limit: 512M
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=64m,mode=1777
      - /var/cache/searxng:noexec,nosuid,nodev,size=128m,mode=0750,uid=977,gid=977
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - --timeout=3
        - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  playwright-service:
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    command: redis-server --bind 0.0.0.0 --appendonly yes
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    restart: unless-stopped
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  nuq-postgres:
    restart: unless-stopped
    volumes:
      - nuq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  foundationdb:
    profiles: ["foundationdb"]

  foundationdb-init:
    profiles: ["foundationdb"]

volumes:
  redis-data:
  rabbitmq-data:
  nuq-postgres-data:
  app-postgres-data:
  minio-data:
  browser-state:
  codex-auth-state:
  browser-interaction-socket:
  browser-interaction-egress-socket:

networks:
  model-uplink:
    driver: bridge
