services:
  browser-test-postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_USER: firecrawl
      POSTGRES_PASSWORD: password
      POSTGRES_DB: firecrawl
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firecrawl -d firecrawl"]
      interval: 2s
      timeout: 3s
      retries: 30
